[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biostatviz"
version = "0.1.0"
description = "Reproducible scientific statistics and visualization tools for AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
  { name = "BioStatViz contributors" }
]
dependencies = [
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biostatviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
